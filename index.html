<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Wistron Server Knowledge — 登入</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#1a0028 0%,#3d0060 50%,#702082 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:#fff;border-radius:20px;padding:48px 44px;width:100%;max-width:420px;
  box-shadow:0 24px 80px rgba(0,0,0,0.35);margin:20px;}
.logo{text-align:center;margin-bottom:32px;}
.logo-icon{width:56px;height:56px;background:linear-gradient(135deg,#702082,#9c27b0);
  border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.logo-icon svg{width:28px;height:28px;}
.logo h1{font-size:20px;font-weight:700;color:#1a1a1a;margin-bottom:4px;}
.logo p{font-size:13px;color:#888;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;
  text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;}
.form-group input{width:100%;padding:12px 14px;font-size:15px;
  border:1.5px solid #e0e0e0;border-radius:10px;outline:none;
  transition:all 0.2s;background:#fafafa;font-family:inherit;}
.form-group input:focus{border-color:#702082;background:#fff;
  box-shadow:0 0 0 3px rgba(112,32,130,0.1);}
.login-btn{width:100%;padding:13px;font-size:15px;font-weight:700;
  background:linear-gradient(135deg,#702082,#9c27b0);color:#fff;
  border:none;border-radius:10px;cursor:pointer;transition:all 0.2s;margin-top:4px;}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(112,32,130,0.4);}
.login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.error-msg{background:#fff0f0;border:1px solid #ffcdd2;color:#c62828;
  padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;}
.error-msg.show{display:block;}
.footer-note{text-align:center;font-size:12px;color:#aaa;margin-top:24px;}
</style>
</head>
<body>
<script>
  // 直接跳轉到主系統，暫時繞過登入
  location.href = 'app.html';
</script>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg>
    </div>
    <h1>Wistron Server Knowledge</h1>
    <p>請登入以存取知識庫</p>
  </div>
  <div class="error-msg" id="error-msg"></div>
  <div class="form-group">
    <label>電子郵件</label>
    <input type="email" id="email" placeholder="your@email.com" autocomplete="email"/>
  </div>
  <div class="form-group">
    <label>密碼</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
  </div>
  <button class="login-btn" id="login-btn" onclick="doLogin()">登入</button>
  <div class="footer-note">還沒有帳號？<a href="register.html" style="color:#9c27b0;font-weight:600;text-decoration:none;">立即註冊</a></div>
</div>

<script>
// ── 請將下面兩個值換成你的 Supabase 專案資訊 ──
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 已登入則直接跳轉
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) location.href = 'app.html';
})();

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('error-msg');
  errEl.classList.remove('show');
  if (!email || !password) { showError('請填寫電子郵件與密碼'); return; }
  btn.disabled = true; btn.textContent = '登入中...';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    showError('帳號或密碼錯誤，請再試一次');
    btn.disabled = false; btn.textContent = '登入';
  } else {
    location.href = 'app.html';
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.classList.add('show');
}

// Enter 鍵觸發登入
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
