<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>後台管理 — Wistron</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f5f3;color:#1a1a1a;min-height:100vh;}
.header{background:#1a1a1a;color:#fff;padding:16px 28px;display:flex;
  align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header h1{font-size:16px;font-weight:700;}
.header-right{display:flex;align-items:center;gap:12px;font-size:13px;}
.back-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;padding:6px 14px;
  border-radius:8px;cursor:pointer;font-size:13px;}
.back-btn:hover{background:rgba(255,255,255,0.2);}
.logout-btn{color:#aaa;cursor:pointer;background:none;border:none;font-size:13px;}
.logout-btn:hover{color:#fff;}

.main{max-width:1200px;margin:0 auto;padding:20px 16px;}

/* 統計卡片 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:#fff;border-radius:12px;padding:18px 20px;
  border:0.5px solid rgba(0,0,0,0.08);}
.stat-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;
  letter-spacing:0.04em;margin-bottom:6px;}
.stat-value{font-size:28px;font-weight:700;color:#1a1a1a;}
.stat-sub{font-size:12px;color:#aaa;margin-top:2px;}

/* 頁籤 */
.tabs{display:flex;gap:0;border-bottom:1px solid #e0e0e0;margin-bottom:16px;}
.tab{padding:10px 20px;font-size:14px;font-weight:600;color:#888;
  cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a;}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* 工具列 */
.toolbar{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.toolbar-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filter-input{padding:7px 12px;font-size:13px;border:1px solid #ddd;
  border-radius:8px;outline:none;background:#fff;min-width:200px;}
.filter-input:focus{border-color:#702082;}
.export-btn{background:#702082;color:#fff;border:none;padding:7px 14px;
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.export-btn:hover{background:#5a1a6a;}

/* 表格 */
.table-wrap{background:#fff;border-radius:10px;border:0.5px solid rgba(0,0,0,0.1);
  overflow:auto;max-height:60vh;}
.table-wrap::-webkit-scrollbar{width:6px;height:6px;}
.table-wrap::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}
.log-table{width:100%;border-collapse:collapse;font-size:13px;min-width:800px;}
.log-table thead th{position:sticky;top:0;background:#1a1a1a;color:#fff;
  padding:10px 12px;text-align:left;white-space:nowrap;font-size:12px;
  font-weight:600;letter-spacing:0.03em;}
.log-table td{padding:9px 12px;border-bottom:1px solid #f0f0f0;vertical-align:top;}
.log-table tbody tr:hover{background:#fafafa;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}
.badge.insert{background:#e8f5e9;color:#2e7d32;}
.badge.update{background:#fff3e0;color:#e65100;}
.badge.delete{background:#ffebee;color:#c62828;}
.badge.login{background:#e3f2fd;color:#1565c0;}
.badge.search{background:#f3e5f5;color:#6a1b9a;}
.badge.admin{background:#f0e6f5;color:#702082;}
.badge.viewer{background:#e8f5e9;color:#2e7d32;}

/* diff 顯示 */
.diff-btn{font-size:11px;color:#702082;text-decoration:underline;cursor:pointer;background:none;border:none;}
.diff-panel{background:#f9f9f9;border-radius:6px;padding:10px;margin-top:6px;
  font-size:11px;font-family:monospace;display:none;max-height:200px;overflow-y:auto;}
.diff-panel.open{display:block;}
.diff-add{color:#2e7d32;background:#e8f5e9;padding:1px 4px;border-radius:2px;}
.diff-del{color:#c62828;background:#ffebee;padding:1px 4px;border-radius:2px;}

/* 用戶管理 */
.user-table{width:100%;border-collapse:collapse;font-size:13px;}
.user-table thead th{background:#1a1a1a;color:#fff;padding:10px 12px;text-align:left;font-size:12px;font-weight:600;}
.user-table td{padding:9px 12px;border-bottom:1px solid #f0f0f0;}
.user-table tbody tr:hover{background:#fafafa;}
.role-select{padding:4px 8px;border-radius:6px;border:1px solid #ddd;font-size:12px;font-family:inherit;cursor:pointer;}

.empty{text-align:center;padding:40px;color:#bbb;font-size:14px;}
.loading{text-align:center;padding:40px;color:#888;font-size:14px;}
</style>
</head>
<body>
<div class="header">
  <h1>⚙ 後台管理</h1>
  <div class="header-right">
    <span id="admin-email"></span>
    <button class="back-btn" onclick="location.href='app.html'">← 返回主系統</button>
    <button class="logout-btn" onclick="doLogout()">登出</button>
  </div>
</div>

<div class="main">
  <!-- 統計卡片 -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">總用戶數</div>
      <div class="stat-value" id="stat-users">—</div>
      <div class="stat-sub">已註冊帳號</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">今日登入</div>
      <div class="stat-value" id="stat-logins">—</div>
      <div class="stat-sub">24 小時內</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">CMF 編輯次數</div>
      <div class="stat-value" id="stat-edits">—</div>
      <div class="stat-sub">全部時間</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">搜尋次數</div>
      <div class="stat-value" id="stat-searches">—</div>
      <div class="stat-sub">全部時間</div>
    </div>
  </div>

  <!-- 頁籤 -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('login-tab',this)">登入紀錄</div>
    <div class="tab" onclick="switchTab('edit-tab',this)">CMF 編輯紀錄</div>
    <div class="tab" onclick="switchTab('search-tab',this)">搜尋紀錄</div>
    <div class="tab" onclick="switchTab('user-tab',this)">用戶管理</div>
  </div>

  <!-- 登入紀錄 -->
  <div class="tab-content active" id="login-tab">
    <div class="toolbar">
      <div class="toolbar-left">
        <input class="filter-input" type="text" id="login-filter" placeholder="搜尋 Email..." oninput="filterTable('login')"/>
      </div>
      <button class="export-btn" onclick="exportTab('login')">匯出 Excel</button>
    </div>
    <div class="table-wrap">
      <table class="log-table" id="login-table">
        <thead><tr>
          <th>時間</th><th>Email</th><th>裝置類型</th><th>瀏覽器 / OS</th><th>IP</th>
        </tr></thead>
        <tbody id="login-body"><tr><td colspan="5" class="loading">載入中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- CMF 編輯紀錄 -->
  <div class="tab-content" id="edit-tab">
    <div class="toolbar">
      <div class="toolbar-left">
        <input class="filter-input" type="text" id="edit-filter" placeholder="搜尋 Email 或動作..." oninput="filterTable('edit')"/>
      </div>
      <button class="export-btn" onclick="exportTab('edit')">匯出 Excel</button>
    </div>
    <div class="table-wrap">
      <table class="log-table" id="edit-table">
        <thead><tr>
          <th>時間</th><th>Email</th><th>動作</th><th>Brand</th><th>W-PN</th><th>變更詳情</th>
        </tr></thead>
        <tbody id="edit-body"><tr><td colspan="6" class="loading">載入中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 搜尋紀錄 -->
  <div class="tab-content" id="search-tab">
    <div class="toolbar">
      <div class="toolbar-left">
        <input class="filter-input" type="text" id="search-filter" placeholder="搜尋關鍵字..." oninput="filterTable('search')"/>
      </div>
      <button class="export-btn" onclick="exportTab('search')">匯出 Excel</button>
    </div>
    <div class="table-wrap">
      <table class="log-table" id="search-table">
        <thead><tr>
          <th>時間</th><th>Email</th><th>類型</th><th>搜尋關鍵字</th><th>分類</th><th>結果數</th>
        </tr></thead>
        <tbody id="search-body"><tr><td colspan="6" class="loading">載入中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 用戶管理 -->
  <div class="tab-content" id="user-tab">
    <div class="toolbar">
      <div class="toolbar-left">
        <input class="filter-input" type="text" id="user-filter" placeholder="搜尋 Email..." oninput="filterTable('user')"/>
      </div>
      <button class="export-btn" onclick="exportTab('user')">匯出 Excel</button>
    </div>
    <div class="table-wrap">
      <table class="log-table user-table" id="user-table">
        <thead><tr>
          <th>Email</th><th>姓名</th><th>角色</th><th>最後登入</th><th>建立時間</th><th>操作</th>
        </tr></thead>
        <tbody id="user-body"><tr><td colspan="6" class="loading">載入中...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kaxyjqkzkvgpuphftlov.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtheHlqcWt6a3ZncHVwaGZ0bG92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyODkzMDgsImV4cCI6MjA5ODg2NTMwOH0.m5iXrxEiPJklJUac0ZzI3u-DZE8R3GBw1Re-hKU3Cz4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allLoginLogs = [], allEditLogs = [], allSearchLogs = [], allUsers = [];

// ── Auth check ──
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'index.html'; return; }
  const role = session.user.user_metadata?.role;
  if (role !== 'admin') { alert('無後台存取權限'); location.href = 'app.html'; return; }
  document.getElementById('admin-email').textContent = session.user.email;
  await Promise.all([loadLoginLogs(), loadEditLogs(), loadSearchLogs(), loadStats()]);
}

async function doLogout() { await sb.auth.signOut(); location.href = 'index.html'; }

// ── 統計 ──
async function loadStats() {
  const today = new Date(); today.setHours(0,0,0,0);
  const { count: loginCount } = await sb.from('login_logs').select('*',{count:'exact',head:true})
    .gte('created_at', today.toISOString());
  const { count: editCount } = await sb.from('cmf_edit_logs').select('*',{count:'exact',head:true});
  const { count: searchCount } = await sb.from('abbr_search_logs').select('*',{count:'exact',head:true});
  document.getElementById('stat-logins').textContent = loginCount ?? 0;
  document.getElementById('stat-edits').textContent = editCount ?? 0;
  document.getElementById('stat-searches').textContent = searchCount ?? 0;
}

// ── 載入登入紀錄 ──
async function loadLoginLogs() {
  const { data } = await sb.from('login_logs').select('*').order('created_at',{ascending:false}).limit(500);
  allLoginLogs = data || [];
  renderLoginLogs(allLoginLogs);
}

function renderLoginLogs(rows) {
  const body = document.getElementById('login-body');
  if (!rows.length) { body.innerHTML = '<tr><td colspan="5" class="empty">尚無登入紀錄</td></tr>'; return; }
  body.innerHTML = rows.map(r => `
    <tr>
      <td style="white-space:nowrap">${fmtDate(r.created_at)}</td>
      <td>${r.email||''}</td>
      <td><span class="badge login">${r.device_type||'Unknown'}</span></td>
      <td style="font-size:12px;color:#555;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.user_agent||''}">${parseUA(r.user_agent)}</td>
      <td style="font-family:monospace;font-size:12px;">${r.ip_address||''}</td>
    </tr>`).join('');
}

// ── 載入 CMF 編輯紀錄 ──
async function loadEditLogs() {
  const { data } = await sb.from('cmf_edit_logs').select('*').order('created_at',{ascending:false}).limit(500);
  allEditLogs = data || [];
  renderEditLogs(allEditLogs);
}

function renderEditLogs(rows) {
  const body = document.getElementById('edit-body');
  if (!rows.length) { body.innerHTML = '<tr><td colspan="6" class="empty">尚無編輯紀錄</td></tr>'; return; }
  body.innerHTML = rows.map((r,i) => {
    const before = r.before_data || {};
    const after  = r.after_data  || {};
    const brand  = after.brand || before.brand || '';
    const wpn    = after.wstron_color_pn || before.wstron_color_pn || '';
    const diffId = 'diff-'+i;
    return `<tr>
      <td style="white-space:nowrap">${fmtDate(r.created_at)}</td>
      <td>${r.email||''}</td>
      <td><span class="badge ${r.action}">${{insert:'新增',update:'編輯',delete:'刪除'}[r.action]||r.action}</span></td>
      <td>${brand}</td>
      <td>${wpn}</td>
      <td>
        ${r.action==='update' ? `<button class="diff-btn" onclick="toggleDiff('${diffId}')">查看變更</button>
        <div class="diff-panel" id="${diffId}">${buildDiff(before,after)}</div>` : '—'}
      </td>
    </tr>`;
  }).join('');
}

function buildDiff(before, after) {
  const keys = new Set([...Object.keys(before), ...Object.keys(after)]);
  let html = '';
  keys.forEach(k => {
    const bv = String(before[k]||''), av = String(after[k]||'');
    if (bv !== av) html += `<div><b>${k}:</b> <span class="diff-del">${bv||'(空)'}</span> → <span class="diff-add">${av||'(空)'}</span></div>`;
  });
  return html || '（無變更）';
}

function toggleDiff(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

// ── 載入搜尋紀錄 ──
async function loadSearchLogs() {
  const { data } = await sb.from('abbr_search_logs').select('*').order('created_at',{ascending:false}).limit(500);
  allSearchLogs = data || [];
  renderSearchLogs(allSearchLogs);
}

function renderSearchLogs(rows) {
  const body = document.getElementById('search-body');
  if (!rows.length) { body.innerHTML = '<tr><td colspan="6" class="empty">尚無搜尋紀錄</td></tr>'; return; }
  body.innerHTML = rows.map(r => `
    <tr>
      <td style="white-space:nowrap">${fmtDate(r.created_at)}</td>
      <td>${r.email||''}</td>
      <td><span class="badge search">縮寫查詢</span></td>
      <td>${r.search_query||''}</td>
      <td>${r.category||'全部'}</td>
      <td>${r.result_count??''}</td>
    </tr>`).join('');
}

// ── 用戶管理 ──
async function loadUserTab() {
  if (allUsers.length) return;
  // 從 login_logs 聚合用戶資訊（因無法直接讀 auth.users）
  const { data: logs } = await sb.from('login_logs').select('email,user_id,created_at').order('created_at',{ascending:false});
  // 從 cmf_edit_logs 取編輯者
  const { data: edits } = await sb.from('cmf_edit_logs').select('email,user_id,created_at').order('created_at',{ascending:false});
  const userMap = {};
  [...(logs||[]), ...(edits||[])].forEach(r => {
    if (!userMap[r.email]) userMap[r.email] = { email: r.email, user_id: r.user_id, last_seen: r.created_at };
    else if (r.created_at > userMap[r.email].last_seen) userMap[r.email].last_seen = r.created_at;
  });
  allUsers = Object.values(userMap);
  document.getElementById('stat-users').textContent = allUsers.length;
  renderUsers(allUsers);
}

function renderUsers(rows) {
  const body = document.getElementById('user-body');
  if (!rows.length) { body.innerHTML = '<tr><td colspan="6" class="empty">尚無用戶資料</td></tr>'; return; }
  body.innerHTML = rows.map(r => `
    <tr>
      <td>${r.email}</td>
      <td>—</td>
      <td><span class="badge viewer">一般用戶</span></td>
      <td style="white-space:nowrap">${fmtDate(r.last_seen)}</td>
      <td>—</td>
      <td style="font-size:12px;color:#aaa;">—</td>
    </tr>`).join('');
}

// ── 篩選 ──
function filterTable(type) {
  const kw = document.getElementById(type+'-filter').value.toLowerCase();
  if (type==='login') renderLoginLogs(allLoginLogs.filter(r=>(r.email||'').toLowerCase().includes(kw)));
  if (type==='edit')  renderEditLogs(allEditLogs.filter(r=>(r.email||'').toLowerCase().includes(kw)||(r.action||'').includes(kw)));
  if (type==='search') renderSearchLogs(allSearchLogs.filter(r=>(r.email||'').toLowerCase().includes(kw)||(r.search_query||'').toLowerCase().includes(kw)));
  if (type==='user')  renderUsers(allUsers.filter(r=>(r.email||'').toLowerCase().includes(kw)));
}

// ── 匯出 ──
function exportTab(type) {
  let data, filename;
  if (type==='login') {
    data = allLoginLogs.map(r=>({時間:fmtDate(r.created_at),Email:r.email,裝置:r.device_type,瀏覽器:parseUA(r.user_agent),IP:r.ip_address}));
    filename = 'login_logs.xlsx';
  } else if (type==='edit') {
    data = allEditLogs.map(r=>({時間:fmtDate(r.created_at),Email:r.email,動作:r.action,CMF_ID:r.cmf_id,修改前:JSON.stringify(r.before_data),修改後:JSON.stringify(r.after_data)}));
    filename = 'edit_logs.xlsx';
  } else if (type==='search') {
    data = allSearchLogs.map(r=>({時間:fmtDate(r.created_at),Email:r.email,搜尋關鍵字:r.search_query,分類:r.category,結果數:r.result_count}));
    filename = 'search_logs.xlsx';
  } else {
    data = allUsers.map(r=>({Email:r.email,最後登入:fmtDate(r.last_seen)}));
    filename = 'users.xlsx';
  }
  if (!data.length) { alert('尚無資料可匯出'); return; }
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  XLSX.writeFile(wb, filename);
}

// ── 頁籤切換 ──
function switchTab(id, el) {
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
  if (id==='user-tab') loadUserTab();
}

// ── 工具函式 ──
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function parseUA(ua) {
  if (!ua) return 'Unknown';
  let browser = 'Unknown', os = 'Unknown';
  if (/Chrome\//.test(ua) && !/Edg/.test(ua)) browser = 'Chrome';
  else if (/Firefox\//.test(ua)) browser = 'Firefox';
  else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
  else if (/Edg\//.test(ua)) browser = 'Edge';
  if (/Windows/.test(ua)) os = 'Windows';
  else if (/Mac OS/.test(ua)) os = 'macOS';
  else if (/iPhone|iPad/.test(ua)) os = 'iOS';
  else if (/Android/.test(ua)) os = 'Android';
  return `${browser} / ${os}`;
}

init();
</script>
</body>
</html>
